<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 과거와 현재를 이어주는 추억의 명곡들</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#0c0908;font-family:Arial,"Noto Sans KR",sans-serif;color:#fff}
.poster{position:relative;max-width:1280px;margin:auto}
.poster img{display:block;width:100%;height:auto}
.hot{position:absolute;cursor:pointer;background:transparent;border:0;z-index:3}
.book{left:4%;top:55%;width:23%;height:14%} .lookup{left:27%;top:55%;width:23%;height:14%}
.cancel{left:50%;top:55%;width:23%;height:14%}
.seatbox{position:absolute;left:73%;top:55%;width:23%;height:14%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.liveSeats{background:#fff8ee;color:#2b1811;padding:4px 10px;border-radius:8px;font-weight:800;font-size:clamp(14px,2.1vw,29px);box-shadow:0 2px 10px #0003}
dialog{width:min(530px,calc(100% - 28px));border:1px solid #c89e5d;border-radius:16px;background:#fbf2e3;color:#29170f;padding:26px;box-shadow:0 30px 100px #000c}
dialog::backdrop{background:#000c;backdrop-filter:blur(4px)} dialog h2{margin:3px 0 20px}
label{display:block;margin:13px 0 6px;font-weight:700} input,select{width:100%;padding:12px;border:1px solid #c6ad86;border-radius:8px;font-size:16px;background:#fffdf9}
button.action{border:0;border-radius:999px;padding:12px 20px;margin-top:15px;background:#d8ae61;color:#27160e;font-weight:800;cursor:pointer}
.close{float:right;border:1px solid #b99c70;background:transparent;border-radius:999px;padding:7px 12px;cursor:pointer}
.agree{display:flex;gap:8px;font-size:12px;font-weight:400}.agree input{width:auto}.msg{margin-top:13px;font-weight:700;line-height:1.55}
.hint{max-width:1280px;margin:auto;padding:14px 20px;color:#b9aa9d;font-size:12px;text-align:center}
@media(max-width:650px){.poster{min-width:650px;transform-origin:top left} body{overflow-x:auto} .liveSeats{font-size:15px}}
</style></head>

<dialog id="booking"><button class="close" onclick="booking.close()">닫기</button><h2>공연 예매</h2>
<form id="bf"><label>이름</label><input name="name" required maxlength="30">
<label>휴대전화번호</label><input name="phone" required placeholder="010-1234-5678">
<label>예매 매수</label><select name="qty"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select>
<label class="agree"><input type="checkbox" required> 예매 처리 및 확인을 위한 이름·휴대전화번호 수집에 동의합니다.</label>
<button class="action">예매 완료</button><div id="bm" class="msg"></div></form></dialog>

<dialog id="lookup"><button class="close" onclick="lookup.close()">닫기</button><h2>예매 확인 · 취소</h2>
<form id="lf"><label>이름</label><input name="name" required>
<label>휴대전화번호</label><input name="phone" required>
<button class="action">예매 조회</button><div id="lm" class="msg"></div><div id="ca"></div></form></dialog>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzfLf6oMzYRgV8zYfiAKmQo8sf0Y1FT7vr8U1U8mVz8Cq5fJWxfZBSKpzYmVN099EHi/exec";
async function api(action,payload={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,...payload})});return await r.json()}
async function seats(){try{const d=await api("status");document.getElementById("remaining").textContent=d.remaining}catch(e){}}
bf.onsubmit=async e=>{e.preventDefault();const f=new FormData(bf);bm.textContent="처리 중...";try{const d=await api("book",{name:f.get("name"),phone:f.get("phone"),qty:+f.get("qty")});bm.textContent=d.ok?"예매 완료! 예매번호: "+d.bookingId:d.message;if(d.ok){bf.reset();seats()}}catch(x){bm.textContent=x.message}};
lf.onsubmit=async e=>{e.preventDefault();const f=new FormData(lf);ca.innerHTML="";lm.textContent="조회 중...";try{const d=await api("lookup",{name:f.get("name"),phone:f.get("phone")});if(!d.ok){lm.textContent=d.message;return}lm.textContent=`예매번호 ${d.bookingId} · ${d.qty}매 · ${d.status}`;if(d.status==="CONFIRMED"){const b=document.createElement("button");b.className="action";b.type="button";b.textContent="예매 취소";b.onclick=async()=>{if(!confirm("예매를 취소하시겠습니까?"))return;const x=await api("cancel",{bookingId:d.bookingId,name:f.get("name"),phone:f.get("phone")});lm.textContent=x.message;ca.innerHTML="";seats()};ca.appendChild(b)}}catch(x){lm.textContent=x.message}};
seats();
</script></body></html>
